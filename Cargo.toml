[workspace]
members = ["crates/proofathome-core", "crates/proofathome"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/proofathome/proofathome"
homepage = "https://proofathome.org"

[workspace.dependencies]
proofathome-core = { path = "crates/proofathome-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
